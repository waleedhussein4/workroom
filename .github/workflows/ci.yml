name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a deploy be re-run without an empty commit, which matters when the
  # only thing that changed is a secret or an environment variable.
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @workroom/web
      - run: npm run typecheck --workspace @workroom/sync

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workroom
        ports:
          - 5432:5432
        # Without the health check the job races the container and the first
        # migration fails on a refused connection.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workroom
      BETTER_AUTH_SECRET: ci-only-secret-long-enough-to-satisfy-entropy-checks
      REALTIME_JWT_SECRET: ci-realtime-secret
      SYNC_INTERNAL_SECRET: ci-internal-secret
      SYNC_INTERNAL_URL: http://127.0.0.1:1234
      NEXT_PUBLIC_SYNC_URL: ws://127.0.0.1:1234
      BETTER_AUTH_URL: http://127.0.0.1:3100
      AUTH_REQUIRE_EMAIL_VERIFICATION: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run build --workspace @workroom/web
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # --- Continuous deployment -------------------------------------------------
  # Both jobs are gated on the DEPLOY_ENABLED repository variable so they skip
  # cleanly (rather than failing red) until apps/web exists and the Vercel
  # secrets are set. To turn deployment on:
  #
  #   gh variable set DEPLOY_ENABLED --body true
  #   gh secret set VERCEL_TOKEN
  #   gh secret set VERCEL_ORG_ID
  #   gh secret set VERCEL_PROJECT_ID
  #
  # `needs` guarantees nothing deploys unless format, lint, typecheck and the
  # unit tests are all green first.

  # Deploys upload the source and let Vercel build it, rather than building
  # here and uploading the output.
  #
  # The env vars on the project are marked Sensitive, which means `vercel pull`
  # returns the literal string "[SENSITIVE]" instead of their values. Building
  # in CI with those produces a real build that is quietly wrong: the auth
  # client ends up calling new URL("[SENSITIVE]") and prerendering dies.
  #
  # Building on Vercel avoids that, and is the better arrangement anyway. CI
  # never handles production secrets, and the Sensitive marking keeps meaning
  # what it says. The cost is that the build runs twice, once in the `build`
  # job to catch errors early and once on Vercel to produce the artifact.

  deploy-preview:
    name: Deploy preview
    needs: [format, lint, typecheck, test, build, e2e]
    if: github.event_name == 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Deploy
        id: deploy
        run: |
          url=$(npx --yes vercel@latest deploy --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  deploy-production:
    name: Deploy production
    needs: [format, lint, typecheck, test, build, e2e]
    # A manual run deploys too, otherwise workflow_dispatch cannot do the one
    # thing it was added for: redeploying when a secret changed and the
    # repository did not.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Deploy
        id: deploy
        run: |
          url=$(npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
